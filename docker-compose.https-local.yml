services:
  app:
    environment:
      TRUST_PROXY: "1"
  https-local:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:18443:443"
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - ./.runtime/https:/certs:ro
    depends_on:
      app:
        condition: service_healthy
